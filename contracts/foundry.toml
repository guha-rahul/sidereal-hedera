[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
evm_version = "paris"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 64
depth = 48
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

# Current ATS factory bytecode requires Cancun execution during live simulation.
[profile.hedera_live]
evm_version = "cancun"
