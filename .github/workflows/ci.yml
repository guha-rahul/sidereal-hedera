# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      # lib/ is not committed; fetch the pinned dependencies. remappings.txt is
      # committed, so the imports resolve once the sources are in place.
      - name: Install Solidity dependencies
        run: |
          python3 scripts/install-deps.py
      - name: Build
        run: forge build
      - name: Test
        run: forge test
      - name: Build Hedera deployment artifacts
        run: FOUNDRY_PROFILE=hedera_live forge build --out "$RUNNER_TEMP/sidereal-hedera-out" --cache-path "$RUNNER_TEMP/sidereal-hedera-cache"

  sdk:
    name: sdk (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sidereal/sdk run typecheck
      - run: pnpm --filter @sidereal/sdk test
      - run: pnpm --filter @sidereal/sdk build

  app:
    name: app (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sidereal/sdk build
      - run: pnpm --filter @sidereal/app run typecheck
      - run: pnpm --filter @sidereal/app test
      - run: pnpm --filter @sidereal/app run build
